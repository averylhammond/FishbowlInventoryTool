name: Integration Test Workflow

# Run the integration tests pipeline on pull requests to main branch
on:
  pull_request:
    branches: [ main ]

  # Allow for the job to be ran manually from the GitHub Actions UI
  workflow_dispatch:

jobs:
  integration-tests:

    # Give the job a name to link into the Github Rules UI
    name: Integration Tests CI Check

    runs-on: ubuntu-latest

    # Checkout repo, including the private submodule holding the test data
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.CUSTOMER_DATA_PAT }}

    # Set up Python environment
    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: "3.11.9"

    # Install project dependencies. The dev set, not release.txt: the spreadsheet
    # check below reads the generated workbooks with openpyxl, which is pinned there.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt

    # Copy integration test data into the expected input directories
    - name: Copy integration test data
      run: |
        ./scripts/copy_resources.sh

    # Run integration tests to generate results.txt
    - name: Run integration tests
      run: |
        python main.py --integration-test

    # Verify that the results.txt file matches the expected output
    - name: Verify integration test results
      run: |
        cp ./automated-inventory-testing/canonical_correct_results.txt .
        if diff -q ./logs/results.txt canonical_correct_results.txt >/dev/null; then
            echo -e "\e[1;3;32mOutput matches, tests pass.\e[0m"
            exit 0
        else
            echo -e "\e[1;3;31mOutput mismatch, tests do not pass.\e[0m"
            exit 1
        fi

    # Dump the generated .xlsx files so the spreadsheet itself can be checked. The results
    # file above is a parser trace built from the entry objects and never touches the
    # workbook, which is how three Priority-0 spreadsheet bugs shipped past it (#56).
    - name: Dump generated spreadsheets
      run: |
        python scripts/dump_workbooks.py

    # Verify that the generated spreadsheets match the expected dump. Kept a separate step
    # from the results check above so a failure names which artifact drifted.
    - name: Verify generated spreadsheet contents
      run: |
        if diff --strip-trailing-cr -q ./logs/spreadsheet_dump.txt ./automated-inventory-testing/canonical_correct_spreadsheets.txt >/dev/null; then
            echo -e "\e[1;3;32mSpreadsheets match, tests pass.\e[0m"
            exit 0
        else
            echo -e "\e[1;3;31mSpreadsheet mismatch, tests do not pass.\e[0m"
            exit 1
        fi
