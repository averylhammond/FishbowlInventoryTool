name: Release Workflow

# Build and publish a release whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags: [ 'v*' ]

# Allow the job to create the GitHub Release and upload the packaged assets
permissions:
  contents: write

jobs:
  release:

    # Give the job a name to link into the Github Rules UI
    name: Build and Publish Release

    # Windows is required here, not just preferred: PyInstaller must produce the Windows
    # executable the app ships as, and Inno Setup's ISCC.exe is Windows-only. This also
    # means the integration test below runs on the shipping platform, unlike the
    # ubuntu-latest integration-tests.yml check.
    runs-on: windows-latest

    # Make sure that windows is using bash shell, since all terminal commands in this job are bash style
    defaults:
      run:
        shell: bash

    steps:
    # Checkout repo, including the private submodule holding the canonical integration
    # test results. Packaging itself needs nothing from the submodule.
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.CUSTOMER_DATA_PAT }}

    # Set up Python environment
    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: "3.11.9"

    # Install project dependencies (dev set, needed to run the tests below)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt

    # Fail the release if the pushed tag does not match the in-app version,
    # so a release can never ship with an About box that disagrees with the tag
    - name: Verify tag matches source version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        VERSION="$(python -c 'from source import constants; print(constants.VERSION)')"
        echo "Tag version: $TAG / constants.py VERSION: $VERSION"
        if [[ "$TAG" != "$VERSION" ]]; then
            echo "::error::Tag ($TAG) does not match source/constants.py VERSION ($VERSION)."
            exit 1
        fi

    # Copy integration test data into the expected input directories
    - name: Copy integration test data
      run: |
        ./scripts/copy_resources.sh

    # Run unit tests against the tagged commit. The glob is required because the test
    # files use the _tests.py suffix, which pytest's default discovery does not match.
    - name: Run unit tests
      run: |
        pytest tests/*

    # Run integration tests and verify output matches the canonical results
    - name: Run integration test
      run: |
        python main.py --integration-test
        cp ./automated-inventory-testing/canonical_correct_results.txt .
        if diff -q ./logs/results.txt canonical_correct_results.txt >/dev/null; then
            echo -e "\e[1;3;32mOutput matches, tests pass.\e[0m"
        else
            echo -e "\e[1;3;31mOutput mismatch, tests do not pass.\e[0m"
            exit 1
        fi

    # Install Inno Setup so package_release.sh can additionally build the Windows installer
    # (FishbowlInventoryTool_Setup.exe). Chocolatey is preinstalled on windows-latest and installs
    # ISCC.exe to the default location the packaging script probes.
    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress -y

    # Package the release executable into release/FishbowlInventoryTool.zip, and (since
    # Inno Setup is now installed) release/FishbowlInventoryTool_Setup.exe. The script
    # takes no arguments; it builds the payload's input folders empty with mkdir, so the
    # customer PDFs staged above for the integration test never reach the release.
    - name: Package release
      run: |
        ./scripts/package_release.sh

    # Create the GitHub Release with the packaged assets and auto-generated notes
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          release/FishbowlInventoryTool.zip \
          release/FishbowlInventoryTool_Setup.exe \
          --title "$GITHUB_REF_NAME" \
          --generate-notes
