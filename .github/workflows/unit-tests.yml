name: Unit Test Workflow

# Run the unit tests pipeline on pull requests to main branch
on:
  pull_request:
    branches: [ main ]

  # Allow for the job to be ran manually from the GitHub Actions UI
  workflow_dispatch:

jobs:
  unit-tests:

    # Give the job a name to link into the Github Rules UI
    name: Unit Test CI Check

    runs-on: ubuntu-latest

    # Checkout repo. The unit tests mock all of their I/O, so the private
    # submodule holding the test data is deliberately not checked out and no
    # PAT is needed.
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Set up Python environment
    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: "3.11.9"

    # Install development project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt

    # Run unit tests with pytest. The glob is required: test files use the
    # _tests.py suffix, which pytest's default discovery does not match.
    - name: Run unit tests
      run: |
        pytest tests/*
