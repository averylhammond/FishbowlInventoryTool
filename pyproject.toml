# Tool configuration only. This project is a packaged desktop app, not a distributable
# Python package, so there is deliberately no [project] or [build-system] table here.

[tool.pytest.ini_options]
# Both match pytest's defaults for this layout; they are pinned so a future rename cannot
# silently stop the suite from being collected by a bare `pytest` -- the problem #86 fixed.
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["./source"]
omit = [
    "./main.py",
    "./tests/*",
    "./venv/*",
    ".venv/*",
    "./source/__init__.py",
    "./source/constants.py",
    "./source/gui/__init__.py",
]

[tool.coverage.report]
# The 90% gate. Kept here rather than on the CI command line so a local `pytest --cov`
# enforces exactly what code-coverage.yml does.
fail_under = 90

[tool.ruff]
line-length = 120
# CI pins 3.11.9 and fishbowl-common requires >=3.11. There is no [project] table here for
# ruff to infer a target from, so it is stated: without it, UP proposes syntax 3.11 lacks.
target-version = "py311"
# ruff respects .gitignore, but automated-inventory-testing is a submodule rather than an
# ignored path, so a bare `ruff check .` would lint it -- and that would put the private
# repo's customer-data paths into a CI log. fishbowl-common and release are carried over
# from FishbowlInvoiceTool's copy of this block so the three stay diffable; neither
# directory exists here today.
extend-exclude = ["fishbowl-common", "automated-inventory-testing", "release"]

[tool.ruff.format]
# skip-magic-trailing-comma is deliberately left at its default of false. A trailing comma
# is an authoring signal that a construct stays exploded, and honoring it keeps "add one
# import" a one-line diff rather than a whole-line rewrite.

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "BLE", # flake8-blind-except
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TRY", # tryceratops
    "PL",  # pylint
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    # Documented by ruff as conflicting with its own formatter.
    "W191",
    "E111",
    "E114",
    "E117",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # Test parameters are deliberately unannotated -- the docstring's Args: entry carries
    # the type instead. See .claude/rules/tests.md.
    "ANN",
    # An assertion's expected value is meant to be a literal spelled out at the assertion.
    # Hoisting `assert len(widgets) == 18` to a named constant hides the number the test
    # exists to pin.
    "PLR2004",
]

[tool.ruff.lint.isort]
# CLAUDE.md: fishbowl_common is third party, installed from a pinned git tag, and never
# grouped among the source.* imports. Both are stated explicitly rather than inferred so a
# local clone of the sibling package appearing in the tree cannot flip its classification.
known-first-party = ["source"]
known-third-party = ["fishbowl_common"]

[tool.ruff.lint.pylint]
# CLAUDE.md requires narrow dependencies be injected one at a time rather than passing a
# god object, which puts InventoryAppDisplay.__init__ at 11 parameters by design: five
# callbacks, the title, the window resolution, the theme, the font family and size, and
# the persisted settings.
max-args = 11
